# Required check "Migration review" on every PR into main. Merging to main applies new
# migrations to production through the Supabase GitHub integration, so this gates them.
#
# pull_request_target runs this file and .github/scripts/ from main, with secrets. It must never
# check out, install or run PR code: the PR head is fetched as git objects and read with
# `git show` as data only (see .github/scripts/migration-review.mjs).
name: Migration review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: migration-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Migration review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out main (trusted code only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR head as data (not checked out)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin "$HEAD_SHA"

      - name: Review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/migration-review.mjs --base HEAD --head "$HEAD_SHA"
